<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="cg" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8655A" />
      <stop offset="100%" stop-color="#F2A87C" />
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="22" stroke="url(#cg)" stroke-width="1.5" fill="none" opacity="0.6" />
  <!-- Cardinal ticks -->
  <line x1="24" y1="2" x2="24" y2="7" stroke="url(#cg)" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="24" y1="41" x2="24" y2="46" stroke="url(#cg)" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="2" y1="24" x2="7" y2="24" stroke="url(#cg)" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="41" y1="24" x2="46" y2="24" stroke="url(#cg)" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <!-- N needle — warm gradient -->
  <polygon points="24,4 20.5,24 24,21 27.5,24" fill="url(#cg)" />
  <!-- S needle — muted -->
  <polygon points="24,44 20.5,24 24,27 27.5,24" fill="#C4B4A0" opacity="0.8" />
  <!-- Center jewel -->
  <circle cx="24" cy="24" r="3" fill="url(#cg)" />
  <circle cx="24" cy="24" r="1.5" fill="white" opacity="0.7" />
</svg>
