<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="fg" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8655A"/>
      <stop offset="100%" stop-color="#F2A87C"/>
    </linearGradient>
  </defs>
  <!-- N needle (warm gradient) -->
  <polygon points="16,2 13.5,16 18.5,16" fill="url(#fg)"/>
  <!-- S needle (muted) -->
  <polygon points="16,30 13.5,16 18.5,16" fill="#D4C4B0"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.8" fill="url(#fg)"/>
  <!-- E/W ticks -->
  <line x1="2" y1="16" x2="6" y2="16" stroke="url(#fg)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="26" y1="16" x2="30" y2="16" stroke="url(#fg)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="14.5" stroke="url(#fg)" stroke-width="1" fill="none" opacity="0.3"/>
</svg>
